name: Android

# Builds the APK in the cloud, so nobody needs Android Studio to get one — and
# so compile errors land in a log that can be read and fixed without a phone
# or an IDE in the loop.

# Publishing the APK to a release needs write access to repository contents.
permissions:
  contents: write

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action's default package list still includes the obsolete `tools`
      # package, which Google removed from the repository — sdkmanager exits 1
      # looking for it. Ask for exactly what the build needs instead.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # The speech model is deliberately not in git: 40 MB of third-party
      # binary. Cached so it is fetched once rather than every run.
      - name: Cache the speech model
        id: model
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/model-en-us
          # Bump when anything about how the model is prepared changes —
          # a stale cache hit skips the fetch step entirely, so the uuid
          # marker written there would never appear.
          key: vosk-model-small-en-us-0.15-uuid

      - name: Fetch the speech model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          cd android/app/src/main/assets
          curl -sSLO https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk-model-small-en-us-0.15.zip
          mv vosk-model-small-en-us-0.15 model-en-us
          rm vosk-model-small-en-us-0.15.zip
          # Vosk's StorageService reads <model>/uuid to decide whether the
          # copy in internal storage is stale. The models in Vosk's own demo
          # carry one; the plain zip from alphacephei does not, and without it
          # unpacking fails and the app never gets a recogniser at all.
          echo "vosk-model-small-en-us-0.15" > model-en-us/uuid
          ls model-en-us

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check the ladder and the page
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build the debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK after the commit
        if: success()
        run: |
          cd android/app/build/outputs/apk/debug
          for f in *.apk; do mv "$f" "ear-${GITHUB_SHA::7}.apk"; done
          ls -la

      - name: What is actually in the APK
        if: success()
        working-directory: android/app/build/outputs/apk/debug
        run: |
          APK=$(ls *.apk)
          echo "APK on disk: $(stat -c%s "$APK" | numfmt --to=iec)"
          echo
          echo "=== by area (compressed / uncompressed) ==="
          unzip -v "$APK" | awk '
            NF>=8 && $1 ~ /^[0-9]+$/ {
              split($8, p, "/")
              area = (p[1]=="assets" || p[1]=="lib") && p[2]!="" ? p[1]"/"p[2] : p[1]
              raw[area]+=$1; zip[area]+=$3
            }
            END { for (k in zip) printf "%9.1f MB  %9.1f MB  %s\n", zip[k]/1048576, raw[k]/1048576, k }
          ' | sort -rn
          echo
          echo "=== ten largest files (compressed) ==="
          unzip -v "$APK" | awk 'NF>=8 && $1 ~ /^[0-9]+$/ {printf "%8.1f MB  %s\n", $3/1048576, $8}' \
            | sort -rn | head -10 || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ear-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Workflow artifacts are always zipped, and a phone cannot install a zip.
      # A release asset is served as the file itself, so the link below can be
      # opened on the phone and tapped straight into the installer. The tag is
      # rolling: it is replaced on every build, so the URL never changes.
      - name: Publish the APK where a phone can install it
        if: success() && github.ref_name == 'claude/trade-share-prd-dnl2il'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android/app/build/outputs/apk/debug
        run: |
          cp *.apk ear.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ear.apk \
            --target "$GITHUB_SHA" \
            --title "Ear — latest build" \
            --notes "Debug build of \`${GITHUB_SHA:0:7}\`. Open this page on the phone and tap \`ear.apk\` to install."
          echo "Direct link: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/ear.apk"
